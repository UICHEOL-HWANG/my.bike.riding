# 수집기 수동 실행용. 정기 수집은 여기가 아니라 Supabase pg_cron이 한다.
#
# 원래 이 워크플로가 10분마다 수집하도록 만들었으나, 실측 결과 */10 예약이
# 6시간 30분 동안 단 1회만 발화했다(약 3%). 격자 설계는 "지연"은 흡수해도
# "누락"은 못 막는다. 3%짜리 스케줄을 남겨두면 "돌고 있다"는 착각만 주므로
# schedule 트리거를 제거했다. docs/scheduler.sql 참고.
#
# 수동 실행은 남긴다 — pg_cron이 죽었을 때의 비상 경로다.
name: collect

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: uv run python -m collector
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
