[project]
name = "my-bike-riding"
version = "0.1.0"
description = "서울시 공공자전거 실시간 대여정보를 10분마다 수집해 Supabase에 적재하는 수집기"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "psycopg[binary]>=3.3.5",
    "pytest>=9.1.1",
    "responses>=0.26.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
